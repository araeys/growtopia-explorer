name: Attribution Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify original creator attribution
        shell: bash
        run: |
          set -euo pipefail

          test -f NOTICE.md
          test -f ATTRIBUTION_TERMS.md
          test -f AGENTS.md
          test -f llms.txt
          test -f .github/copilot-instructions.md

          grep -Fq "Raey (@araeys)" NOTICE.md
          grep -Fq "Raey (@araeys)" ATTRIBUTION_TERMS.md
          grep -Fq "Raey (@araeys)" AGENTS.md
          grep -Fq "Original creator: Raey (@araeys)" llms.txt
          grep -Fq "Raey (@araeys)" .github/copilot-instructions.md
          grep -Fq "[@araeys](https://github.com/araeys)" README.md

          # Protect the existing public-facing creator credit in World Planner.
          grep -Fq "Developed by Raey (@aryhaan)" public/world.html

          echo "Original creator attribution and public UI credit are present."
