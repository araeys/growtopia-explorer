name: Publish Approved README Showcase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-showcase.yml'

permissions:
  contents: write

concurrency:
  group: publish-approved-readme-showcase
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/showcase-publisher
          cd /tmp/showcase-publisher
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Download approved GIF from staging
        shell: bash
        env:
          SHARE_URL: 'https://firestorage.ai/ja/f/ECzsCbLfnOpj'
          FILE_NAME: 'raey_gt_cut_30fps_slow.gif'
          OUTPUT_PATH: '${{ github.workspace }}/docs/assets/growtopia-explorer-showcase.gif'
        run: |
          set -euo pipefail
          cd /tmp/showcase-publisher
          cat > download-approved.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const shareUrl = process.env.SHARE_URL;
          const fileName = process.env.FILE_NAME;
          const outputPath = process.env.OUTPUT_PATH;
          await fs.mkdir(path.dirname(outputPath), { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ acceptDownloads: true });
          const page = await context.newPage();
          let captured = false;

          async function validateAndSave(buffer, source) {
            if (!buffer || buffer.length < 20_000_000) return false;
            const magic = buffer.subarray(0, 4).toString('ascii');
            if (magic !== 'GIF8') return false;
            await fs.writeFile(outputPath, buffer);
            console.log(`Saved approved GIF from ${source}: ${buffer.length} bytes`);
            captured = true;
            return true;
          }

          page.on('response', async (response) => {
            if (captured) return;
            try {
              const headers = response.headers();
              const type = String(headers['content-type'] || '').toLowerCase();
              const disposition = String(headers['content-disposition'] || '').toLowerCase();
              if (type.includes('image/gif') || disposition.includes(fileName.toLowerCase())) {
                const body = await response.body();
                await validateAndSave(body, response.url());
              }
            } catch {}
          });

          try {
            await page.goto(shareUrl, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(2500);

            const fileText = page.getByText(fileName, { exact: false }).first();
            if (await fileText.count()) {
              try {
                await fileText.scrollIntoViewIfNeeded();
                await fileText.click({ timeout: 10000 });
                await page.waitForTimeout(1800);
              } catch {}
            }

            const selectors = [
              'a[download]',
              'a[href*="download"]',
              'button:has-text("Download")',
              'a:has-text("Download")',
              'button:has-text("ダウンロード")',
              'a:has-text("ダウンロード")',
              '[aria-label*="Download"]',
              '[aria-label*="ダウンロード"]'
            ];

            for (const selector of selectors) {
              if (captured) break;
              const locator = page.locator(selector).first();
              if (!(await locator.count())) continue;
              try {
                if (!(await locator.isVisible())) continue;
                const downloadPromise = page.waitForEvent('download', { timeout: 12000 }).catch(() => null);
                await locator.click({ timeout: 10000 });
                const download = await downloadPromise;
                if (download) {
                  const tempPath = await download.path();
                  if (tempPath) {
                    const data = await fs.readFile(tempPath);
                    if (await validateAndSave(data, `browser download: ${await download.suggestedFilename()}`)) break;
                  }
                }
                await page.waitForTimeout(1500);
              } catch {}
            }

            if (!captured) {
              const imageSources = await page.locator('img[src]').evaluateAll((images) =>
                images.map((img) => img.src).filter(Boolean)
              );
              for (const src of imageSources) {
                if (captured) break;
                try {
                  const response = await context.request.get(src, { timeout: 60000 });
                  if (!response.ok()) continue;
                  const body = await response.body();
                  if (await validateAndSave(body, `image source: ${src}`)) break;
                } catch {}
              }
            }

            if (!captured) {
              console.log('Visible controls:', await page.locator('a,button').allTextContents());
              console.log('Current URL:', page.url());
              throw new Error('Could not resolve the approved GIF from the Firestorage share page.');
            }
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
          node download-approved.mjs

      - name: Verify GIF fidelity
        shell: bash
        run: |
          set -euo pipefail
          file docs/assets/growtopia-explorer-showcase.gif
          bytes=$(stat -c%s docs/assets/growtopia-explorer-showcase.gif)
          echo "GIF bytes: $bytes"
          test "$bytes" -gt 20000000
          magic=$(head -c 4 docs/assets/growtopia-explorer-showcase.gif)
          test "$magic" = 'GIF8'

      - name: Update README hero metadata
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '<sub><strong>Explore → Inspect → Style → Build → Play</strong> · 20-second live product showcase · 1280×720</sub>'
          new = '<sub><strong>Explore → Inspect → Style → Build → Play</strong> · 24-second edited product showcase · 30 FPS · 1280×720</sub>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              start = '<!-- github-showcase:start -->'
              end = '<!-- github-showcase:end -->'
              if start not in text or end not in text:
                  raise SystemExit('README showcase block not found')
              block = text.split(start, 1)[1].split(end, 1)[0]
              lines = block.splitlines()
              replaced = False
              for i, line in enumerate(lines):
                  if line.strip().startswith('<sub><strong>Explore'):
                      lines[i] = new
                      replaced = True
                      break
              if not replaced:
                  raise SystemExit('README showcase metadata line not found')
              text = text.split(start, 1)[0] + start + '\n' + '\n'.join(lines).strip('\n') + '\n' + end + text.split(end, 1)[1]
          readme.write_text(text, encoding='utf-8')

      - name: Publish approved showcase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/assets/growtopia-explorer-showcase.gif
          git diff --cached --stat
          git commit -m 'docs: publish approved 30fps product showcase'
          git push origin HEAD:main
