name: Restore Dual README Showcase

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-dual-showcase.yml'
      - 'scripts/restore-dual-showcase.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore both showcases
        run: python scripts/restore-dual-showcase.py

      - name: Verify README layout
        run: |
          set -e
          grep -Fq 'growtopia-explorer-showcase.gif' README.md
          grep -Fq 'growtopia-explorer-showcase-edited.gif' README.md
          if grep -Fq '![Growtopia Explorer Logo](public/logo.png)' README.md; then exit 1; fi

      - name: Publish README fix
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/assets/growtopia-explorer-showcase.gif docs/assets/growtopia-explorer-showcase-edited.gif
          git commit -m 'docs: restore original preview and keep edited showcase'
          git push origin HEAD:main
